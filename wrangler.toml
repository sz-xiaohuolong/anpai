name = "anpai"
main = "party/worker.ts"
compatibility_date = "2026-10-01"
rules = [{ type = "ESModule", globs = ["**/*.ts"] }]

# 静态前端由 Worker 直接提供（vite build 产物）
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "AnpaiRoom"
class_name = "AnpaiRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AnpaiRoom"]
